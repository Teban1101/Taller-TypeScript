<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Typescript</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .serie-link {
            color: #007bff;
            text-decoration: none;
        }
        .serie-link:hover {
            text-decoration: underline;
        }
        .container {
            margin-top: 30px;
        }
        .tv-header {
            background-color: #17a2b8;
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .tv-icon {
            background-color: #0c5460;
            color: white;
            padding: 5px 8px;
            margin-right: 10px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="tv-header">
            <span class="tv-icon">TV</span>
            <span>TV Series</span>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <div id="series-table">
                    <!-- La tabla se renderizará aquí -->
                </div>
            </div>
            <div class="col-md-4">
                <div id="series-detail">
                    <!-- El detalle de la serie se mostrará aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (opcional, para funcionalidades adicionales) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script principal -->
    <script type="module" src="dist/main.js"></script>
</body>
</html>
